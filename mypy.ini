# Keep in sync with [tool.mypy] in pyproject.toml. CI uses the pyproject
# configuration; this file exists for callers that pass --config-file=mypy.ini.
[mypy]
python_version = 3.11
files = src/advanced_image_sensor_interface/sensor_interface/protocol, src/advanced_image_sensor_interface/sensor_interface/protocol_selector.py
mypy_path = src:stubs
explicit_package_bases = true
check_untyped_defs = false
disallow_any_generics = false
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_subclassing_any = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
warn_unreachable = false
no_implicit_optional = true
strict_optional = true
enable_error_code = ignore-without-code, redundant-expr, truthy-bool

# Per-module options
[mypy-numpy.*]
ignore_missing_imports = true

[mypy-scipy.*]
ignore_missing_imports = true

[mypy-sklearn.*]
ignore_missing_imports = true

[mypy-matplotlib.*]
ignore_missing_imports = true

[mypy-cv2.*]
ignore_missing_imports = true

[mypy-cupy.*]
ignore_missing_imports = true

[mypy-cupyx.*]
ignore_missing_imports = true

[mypy-numba.*]
ignore_missing_imports = true

[mypy-pytest.*]
ignore_missing_imports = true

[mypy-tqdm.*]
ignore_missing_imports = true

[mypy-psutil.*]
ignore_missing_imports = true

[mypy-pywt.*]
ignore_missing_imports = true

[mypy-trimesh.*]
ignore_missing_imports = true

[mypy-smbus.*]
ignore_missing_imports = true

[mypy-skimage.*]
ignore_missing_imports = true
