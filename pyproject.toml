[build-system]
requires = ["setuptools>=70.0.0", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced_image_sensor_interface"
version = "3.2.0"
description = "A high-performance interface for next-generation camera modules with AI/ML enhancements"
readme = "README.md"
authors = [{ name = "Mudit Bhargava", email = "muditbhargava666@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research"
]
keywords = ["image processing", "sensor interface", "camera", "MIPI"]
dependencies = [
    "numpy>=1.23.5",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "Pillow>=12.3.0,<13.0.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "scikit-learn>=1.3.0,<2.0.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
# Core dependencies for basic functionality
core = [
    "numpy>=1.23.5",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "Pillow>=12.3.0,<13.0.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
]

# Full feature set with optional dependencies
full = [
    "opencv-python>=4.8.1,<5.0.0",
    "pandas>=2.1.0,<3.0.0",
    "scikit-image>=0.20.0,<1.0.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "msgpack>=1.2.1",
    "click>=8.3.3",
    # GPU acceleration (optional - graceful degradation if not available)
    "cupy-cuda12x>=12.0.0; sys_platform != 'darwin'",
    "numba>=0.58.0,<1.0.0",
    # Advanced image processing
    "imageio[ffmpeg]>=2.33.0,<3.0.0",
    "rawpy>=0.18.0,<1.0.0",
    # Machine learning and AI
    "torch>=2.0.0,<3.0.0; sys_platform != 'darwin'",
    "torchvision>=0.15.0,<1.0.0; sys_platform != 'darwin'",
    "tensorflow>=2.13.0,<3.0.0; sys_platform != 'darwin'",
    # Keras >= 3.14.0 for security fixes (CVE-2024-xxxx, CVE-2024-xxxx)
    "keras>=3.14.0,<4.0.0",
    # Scientific computing enhancements
    "sympy>=1.12.0,<2.0.0",
    "astropy>=5.3.3,<6.0.0",
    "photutils>=1.9.0,<4.0.0",
    "PyWavelets>=1.4.0,<2.0.0",
    "trimesh>=4.0.0,<6.0.0",
    # Hardware interface simulation
    "pyserial>=3.5.0,<4.0.0",
    "pyusb>=1.2.0,<2.0.0",
    "smbus2>=0.4.0,<1.0.0; sys_platform == 'linux'",
    # Performance monitoring
    "memory-profiler>=0.61.0,<1.0.0",
    "line-profiler>=4.1.0,<5.0.0",
    "py-spy>=0.3.0,<1.0.0",
    # Data formats and serialization
    "h5py>=3.8.0,<4.0.0",
    "zarr>=2.16.0,<4.0.0",
    "msgpack>=1.0.0,<2.0.0",
    "protobuf>=5.29.6",
    # Networking and protocols
    "requests>=2.31.0,<3.0.0",
    "websockets>=11.0.0,<18.0.0",
    "pyzmq>=26.0.0,<27.0.0",
    # Visualization enhancements
    "plotly>=5.17.0,<8.0.0",
    "bokeh>=3.2.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    # Configuration and utilities
    "click>=8.1.0,<9.0.0",
    "rich>=13.6.0,<16.0.0",
    "typer>=0.9.0,<1.0.0",
    "pydantic>=2.4.0,<3.0.0",
    # Development and debugging
    "icecream>=2.1.0,<3.0.0",
    "loguru>=0.7.0,<1.0.0",
    "colorama>=0.4.0,<1.0.0",
    # Optional GUI support
    "tkinter-tooltip>=2.1.0,<4.0.0",
    "pillow-simd>=9.5.0.post2,<10.0.0; sys_platform != 'darwin'",
]

# Development dependencies
dev = [
    "pytest-asyncio>=0.23.0",
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.6.0",
    "ruff>=0.4.0",
    "black>=23.10.0",
    "pyright>=1.1.320",
    "tox>=4.0.0",
    "ipython>=8.18.0",
    "pre-commit>=3.0.0",
]

# Documentation dependencies
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinx-design>=0.5.0",
    "nbsphinx>=0.9.0",
    # Pin pyzmq to version compatible with Python 3.13 (25.1.2 has build issues)
    "pyzmq>=26.0.0",
    # Security updates for transitive dependencies
    "bleach>=6.4.0",
    "mistune>=3.3.0",
    "soupsieve>=2.8.4",
    "tornado>=6.5.7",
    "idna>=3.15",
    "nbconvert>=7.17.1",
    "protobuf>=5.29.6",
]

# Performance testing dependencies
performance = [
    "memory-profiler>=0.60.0",
    "line-profiler>=4.0.0",
    "py-spy>=0.3.14",
]

[project.urls]
Homepage = "https://github.com/muditbhargava66/Advanced-Image-Sensor-Interface"
Documentation = "https://advanced-image-sensor-interface.readthedocs.io/"
Repository = "https://github.com/muditbhargava66/Advanced-Image-Sensor-Interface.git"
Changelog = "https://github.com/muditbhargava66/Advanced-Image-Sensor-Interface/releases"
Issues = "https://github.com/muditbhargava66/Advanced-Image-Sensor-Interface/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["advanced_image_sensor_interface*"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestDeprecationWarning"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/advanced_image_sensor_interface/sensor_interface/protocol",
    "src/advanced_image_sensor_interface/sensor_interface/protocol_selector.py",
]
mypy_path = "src:stubs"
explicit_package_bases = true
check_untyped_defs = false
disallow_any_generics = false
disallow_any_unimported = true
disallow_any_expr = false  # Too strict for numpy
disallow_any_decorated = false  # Too strict for dataclasses
disallow_any_explicit = false  # Allow explicit Any when needed
disallow_subclassing_any = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
warn_unreachable = false
no_implicit_optional = true
strict_optional = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Per-module options
[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cupyx.*"
ignore_missing_imports = true

[tool.black]
line-length = 130
target-version = ["py311"]
skip_magic_trailing_comma = true

[tool.isort]
profile = "black"
line_length = 130
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # Pycodestyle
    "F",   # Pyflakes
    "W",   # Pycodestyle warnings
    "UP",  # Pyupgrade
    "PL",  # Pylint
    "RUF", # Ruff-specific
    "I"    # Isort
]

# Global ignores
ignore = [
    "D",
    "PLR2004",
    "B006",
    "E501",

    "UP007",
    "UP045",   # DO NOT force X | None yet
    "RUF059",  # Allow unused unpacking in demos/examples
    "E712",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLW0603",
    "PLC0415",
    "I001",
    "PLR1730",
]

# Directory-specific ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["ALL"]
"tests/**/*.py" = [
    "D1", "PLR2004", "F841", "I001", "PLC0415"
]
"benchmarks/**/*.py" = ["D1", "B006"]
"scripts/**/*.py" = ["D1", "PLR2004"]
"examples/**/*.py" = [
    "F401",  # Unused imports in examples (might be used by users)
    "D1", "PLR2004"
]
"docs/**/*.py" = [
    "F401",  # Unused imports for optional extension detection
    "D1"
]
"src/advanced_image_sensor_interface/sensor_interface/gpu_acceleration.py" = [
    "F401",  # Optional dependency imports (numba)
]

[tool.pyright]
include = [
    "src/advanced_image_sensor_interface/sensor_interface/protocol",
    "src/advanced_image_sensor_interface/sensor_interface/protocol_selector.py",
]
exclude = ["**/__pycache__", "**/.*", "tests", "benchmarks", "docs", "stubs"]
pythonVersion = "3.11"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
reportImportCycles = false
reportUnusedImport = false
reportUnusedClass = false
reportUnusedFunction = false
reportUnusedVariable = false
reportDuplicateImport = false
reportPrivateUsage = false
reportConstantRedefinition = false
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false
reportUntypedFunctionDecorator = false  # Too strict for common decorators
reportUntypedClassDecorator = false
reportUntypedBaseClass = false
reportUntypedNamedTuple = false
reportCallInDefaultInitializer = false
reportUnnecessaryIsInstance = false
reportUnnecessaryCast = false
reportAssertAlwaysTrue = false
reportSelfClsParameterName = false
reportImplicitStringConcatenation = false

# UV package manager configuration
[tool.uv]
# Use system Python if available
python-preference = "system"

# Compile bytecode for faster subsequent imports
compile-bytecode = true

# Default index for package resolution
index-url = "https://pypi.org/simple"

# Development dependencies available via: uv sync --group dev
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.4.0",
    "black>=23.10.0",
    "mypy>=1.6.0",
    "pyright>=1.1.320",
    "tox>=4.0.0",
    "ipython>=8.18.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinx-design>=0.5.0",
    "nbsphinx>=0.9.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]
