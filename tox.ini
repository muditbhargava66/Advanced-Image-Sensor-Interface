[tox]
minversion = 4.0
envlist = py311, py312, py313, lint, format, mypy, pyright, docs
requires = tox>=4.0

[testenv]
extras = dev, security
commands =
    pytest {posargs:tests} --cov=src --cov-report=term-missing

[testenv:lint]
extras = dev
commands = ruff check .

[testenv:format]
extras = dev
commands =
    black --check src/ examples/ benchmarks/ stubs/
    ruff check .

[testenv:mypy]
extras = dev
commands = mypy --config-file=pyproject.toml

[testenv:pyright]
extras = dev
commands = pyright

[testenv:docs]
extras = docs
commands = sphinx-build -b html docs docs/_build/html

[testenv:benchmark]
extras = performance
commands =
    python benchmarks/speed_tests.py
    python benchmarks/noise_analysis.py
