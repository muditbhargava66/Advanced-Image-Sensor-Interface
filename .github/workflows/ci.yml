name: CI Pipeline

on:
  push:
    branches: [main, develop, version-4.0.0]
    tags: ['v*']
  pull_request:
    branches: [main, version-4.0.0]

permissions:
  contents: read

env:
  UV_VERSION: '0.13.1'
  UV_PYTHON: '3.11'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          # Do not restore mutable dependency caches in this tag/artifact workflow.
          enable-cache: false
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-ubuntu-*.list
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install locked development and security dependencies
        run: |
          uv lock --check
          uv sync --locked --group dev --group build --extra security --no-install-project
          uv sync --locked --group dev --group build --extra security --no-build-isolation
      - name: Lint with Ruff
        run: uv run --no-sync ruff check .
      - name: Check formatting with Black
        run: uv run --no-sync black --check src/ examples/ benchmarks/ stubs/
      - name: Type check with MyPy (advisory baseline)
        continue-on-error: true
        run: uv run --no-sync mypy --config-file=pyproject.toml
      - name: Run tests with optional authenticated encryption
        env:
          PYTHONWARNINGS: default
        run: uv run --no-sync pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing --color=yes

  security:
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          # Do not restore mutable dependency caches in this tag/artifact workflow.
          enable-cache: false
      - name: Install locked audit tools without building the project
        run: uv sync --locked --only-group dev
      - name: Audit every locked profile for this Python and platform
        env:
          AUDIT_DIR: ${{ runner.temp }}/dependency-audit
        run: |
          mkdir -p "$AUDIT_DIR"
          for profile in core security dev docs performance full build; do
            args=()
            if [[ "$profile" == build ]]; then
              args=(--group build)
            elif [[ "$profile" != core ]]; then
              args=(--extra "$profile")
            fi
            uv export --locked --no-default-groups --no-emit-project "${args[@]}" -o "$AUDIT_DIR/$profile.txt"
            uv run --no-sync pip-audit --no-deps --disable-pip -r "$AUDIT_DIR/$profile.txt"
          done
      - name: Verify full extras have compatible wheels
        env:
          FULL_REQUIREMENTS: ${{ runner.temp }}/dependency-audit/full.txt
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv pip compile "$FULL_REQUIREMENTS" --python-version "$PYTHON_VERSION" --only-binary :all: --output-file "$RUNNER_TEMP/full-resolved.txt"
      - name: Security check with Bandit
        # No global skips: source owners must address or narrowly justify findings.
        run: uv run --no-sync bandit -r src/

  full:
    name: Full extras smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          # Do not restore mutable dependency caches in this tag/artifact workflow.
          enable-cache: false
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install locked full extras
        run: |
          uv sync --locked --no-default-groups --group build --extra full --no-install-project
          uv sync --locked --no-default-groups --group build --extra full --no-build-isolation
      - name: Check installed dependency compatibility
        run: uv pip check
      - name: Smoke-test optional imports without requiring GPU hardware
        run: |
          uv run --no-sync python -c "import cv2, numba, rawpy, skimage; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; key = AESGCM.generate_key(bit_length=256); aes = AESGCM(key); nonce = bytes(12); assert aes.decrypt(nonce, aes.encrypt(nonce, b'smoke', None), None) == b'smoke'"
      - name: Smoke-test non-macOS ML imports
        # macOS excludes TensorFlow/Torch/CuPy. Keras needs a separately installed
        # backend there (even its NumPy backend imports JAX); do not claim coverage.
        if: runner.os != 'macOS'
        env:
          KERAS_BACKEND: tensorflow
        run: uv run --no-sync python -c "import cupy, keras, tensorflow, torch, torchvision"

  build:
    runs-on: ubuntu-latest
    needs: [test, security, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          # Do not restore mutable dependency caches in this tag/artifact workflow.
          enable-cache: false
      - name: Install locked build dependencies
        run: uv sync --locked --only-group build
      - name: Build package without unlocked build isolation
        run: uv build --no-build-isolation
      - name: Check package
        run: uv run --no-sync twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          # Do not restore mutable dependency caches in this tag/artifact workflow.
          enable-cache: false
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-ubuntu-*.list
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install locked documentation dependencies
        run: |
          uv sync --locked --no-default-groups --group build --extra docs --no-install-project
          uv sync --locked --no-default-groups --group build --extra docs --no-build-isolation
      - name: Build documentation
        run: uv run --no-sync sphinx-build -b html docs docs/_build/html
      - name: Upload documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: docs/_build/html/
          retention-days: 7
