name: Performance Benchmarks

on:
  push:
    branches: [main, develop, version-4.0.0]
  pull_request:
    branches: [main, develop, version-4.0.0]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install locked benchmark dependencies
        run: |
          uv sync --locked --no-default-groups --group build --extra performance --no-install-project
          uv sync --locked --no-default-groups --group build --extra performance --no-build-isolation
      - name: Run Speed Tests
        run: uv run --no-sync python benchmarks/speed_tests.py
      - name: Run Noise Analysis
        run: uv run --no-sync python benchmarks/noise_analysis.py
