# Dependabot configuration for Advanced Image Sensor Interface
version: 2
updates:
  # uv discovers pyproject.toml, uv.lock and root/child requirements files,
  # including docs/requirements.txt. Do not add an overlapping pip updater.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
